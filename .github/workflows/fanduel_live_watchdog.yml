name: FanDuel 24/7 Live Tennis Watchdog (Real-Time GitHub Actions)

on:
  schedule:
    # Runs every 15 minutes round-the-clock across all global tennis tournament timezones
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      watch_duration_minutes:
        description: 'Duration to actively monitor live feeds in seconds (e.g. 600 for 10 mins continuous loop)'
        required: true
        default: '600'
        type: string
      poll_interval_seconds:
        description: 'Polling interval in seconds (default: 30s)'
        required: true
        default: '30'
        type: string
      iterations:
        description: 'Monte Carlo Simulation Volume per Match'
        required: true
        default: '50000'
        type: string

concurrency:
  group: tennis-engine-repo-push
  cancel-in-progress: false

jobs:
  fanduel-live-monitor:
    name: 24/7 Real-Time FanDuel Watchdog & 50k Monte Carlo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ensure Database Exists (WAL Mode)
        run: python scripts/database.py

      - name: 5. Execute FanDuel Real-Time Watchdog (Pre-Match & Live In-Play)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAW_DURATION: ${{ inputs.watch_duration_minutes }}
          RAW_INTERVAL: ${{ inputs.poll_interval_seconds }}
        run: |
          DURATION="${RAW_DURATION:-600}"
          INTERVAL="${RAW_INTERVAL:-30}"
          python scripts/fanduel_feed.py \
            --mode watch \
            --duration "$DURATION" \
            --interval "$INTERVAL"

      - name: 6. Update Daily Predictions MD with 50,000 Monte Carlo Iterations
        env:
          RAW_ITERS: ${{ inputs.iterations }}
        run: |
          ITERS="${RAW_ITERS:-50000}"
          python scripts/predict.py --iterations "$ITERS"

      - name: 7. Commit & Push Real-Time FanDuel Updates to Repository
        run: |
          git config --global user.name "FanDuelRealTimeBot"
          git config --global user.email "fanduel-bot@users.noreply.github.com"
          git add FANDUEL_LIVE_RADAR.md PREDICTIONS_TODAY.md tennis_engine.db
          if git diff --staged --quiet; then
            echo "No live FanDuel line shifts or score changes detected in this cycle."
          else
            git commit -m "Auto: FanDuel Live In-Play & 50k Monte Carlo Update [skip ci]" || true
            # Resilient push loop that prevents non-fast-forward push rejections when concurrent workflows run
            for attempt in {1..5}; do
              if git push origin main; then
                echo "✅ Successfully pushed to main on attempt $attempt."
                break
              fi
              echo "Push rejected due to concurrent workflow execution (attempt $attempt/5). Synchronizing with remote..."
              git fetch origin main
              git merge -X ours origin/main --no-edit || (git checkout --ours . && git add -A && git commit -m "Merge concurrent changes [skip ci]") || true
              sleep 3
            done
          fi
